name: Build X5 Auto Clicker from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf /tmp/x5project
          mkdir -p /tmp/x5project

          unzip -q X5AutoClicker.zip -d /tmp/x5project

          PROJECT_DIR=$(find /tmp/x5project \
            -maxdepth 3 \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Не найден settings.gradle/settings.gradle.kts внутри ZIP"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          echo "Проект найден:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X5AutoClicker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
